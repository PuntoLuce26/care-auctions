<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'">
  <title>Prompt bar — 6 options · CARe Auctions</title>
  <meta name="theme-color" content="#F7F4EC">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main" class="container">
    <h1>Choose the prompt for the bar.</h1>
    <p class="lead">Six candidates. Pick a number.</p>

    <div class="opt"><p class="opt-num">1 — Minimal &amp; human</p>
      <form class="home-ask" action="icare.html" method="get"><input type="text" name="q" placeholder="Talk to me." autocomplete="off"><a class="mic-btn" href="icare.html" aria-label="Speak to iCARe"><img src="assets/mic.svg" alt=""></a><button type="submit" class="btn btn-primary">Ask</button></form>
    </div>

    <div class="opt"><p class="opt-num">2 — Futuristic &amp; rhythmic</p>
      <form class="home-ask" action="icare.html" method="get"><input type="text" name="q" placeholder="Speak. Ask. iCARe answers." autocomplete="off"><a class="mic-btn" href="icare.html" aria-label="Speak to iCARe"><img src="assets/mic.svg" alt=""></a><button type="submit" class="btn btn-primary">Ask</button></form>
    </div>

    <div class="opt"><p class="opt-num">3 — Visionary</p>
      <form class="home-ask" action="icare.html" method="get"><input type="text" name="q" placeholder="Tell iCARe what you dream of." autocomplete="off"><a class="mic-btn" href="icare.html" aria-label="Speak to iCARe"><img src="assets/mic.svg" alt=""></a><button type="submit" class="btn btn-primary">Ask</button></form>
    </div>

    <div class="opt"><p class="opt-num">4 — Multilingual teaser</p>
      <form class="home-ask" action="icare.html" method="get"><input type="text" name="q" placeholder="Ciao. Hello. Hola. こんにちは — just speak." autocomplete="off"><a class="mic-btn" href="icare.html" aria-label="Speak to iCARe"><img src="assets/mic.svg" alt=""></a><button type="submit" class="btn btn-primary">Ask</button></form>
    </div>

    <div class="opt"><p class="opt-num">5 — Brand &amp; world</p>
      <form class="home-ask" action="icare.html" method="get"><input type="text" name="q" placeholder="One question. A world of auctions." autocomplete="off"><a class="mic-btn" href="icare.html" aria-label="Speak to iCARe"><img src="assets/mic.svg" alt=""></a><button type="submit" class="btn btn-primary">Ask</button></form>
    </div>

    <div class="opt"><p class="opt-num">6 — Pure tech</p>
      <form class="home-ask" action="icare.html" method="get"><input type="text" name="q" placeholder="Your words are enough." autocomplete="off"><a class="mic-btn" href="icare.html" aria-label="Speak to iCARe"><img src="assets/mic.svg" alt=""></a><button type="submit" class="btn btn-primary">Ask</button></form>
    </div>

    <p class="small">Pick one and it goes into every bar of the app.</p>
  </main>
<script src="cookies.js"></script>
<script src="lingua.js"></script>
</body>
</html>
