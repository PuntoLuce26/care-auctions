<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'">
  <title data-i18n="pageTitle"></title>
  <meta name="description" id="meta-description" content="">
  <meta name="theme-color" content="#F7F4EC">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CARe Auctions">
  <link rel="stylesheet" href="styles.css">
  <script src="calcolo.js"></script>
  <script src="app.js"></script>
  <script src="prova-messages.js"></script>
  <script src="prova.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipLink"></a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html"><span class="logo-crop logo-nav"><img src="assets/logo-careauctions-pulito.svg" id="logo-img" alt="CARe Auctions — home"></span></a>
      <div class="segmented" role="group" id="lang-group">
        <button type="button" data-lang="en" lang="en" aria-label="English (EN)">EN</button>
        <button type="button" data-lang="it" lang="it" aria-label="Italiano (IT)">IT</button>
        <button type="button" data-lang="de" lang="de" aria-label="Deutsch (DE)">DE</button>
        <button type="button" data-lang="es" lang="es" aria-label="Español (ES)">ES</button>
        <button type="button" data-lang="fr" lang="fr" aria-label="Français (FR)">FR</button>
        <button type="button" data-lang="ru" lang="ru" aria-label="Русский (RU)">RU</button>
        <button type="button" data-lang="ja" lang="ja" aria-label="日本語 (JA)">JA</button>
        <button type="button" data-lang="ar" lang="ar" dir="rtl" aria-label="العربية (AR)">AR</button>
        <button type="button" data-lang="hi" lang="hi" aria-label="हिन्दी (HI)">HI</button>
        <button type="button" data-lang="ko" lang="ko" aria-label="한국어 (KO)">KO</button>
        <button type="button" data-lang="zh" lang="zh-Hans" aria-label="简体中文 (ZH)">ZH</button>
      </div>
      <button type="button" class="font-scale" id="font-scale" aria-label="Text size 100%. Activate for 115%.">Aa <span class="font-scale-level" id="font-scale-level">100%</span></button>
      <span class="visually-hidden" id="font-scale-status" role="status"></span>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p class="tagline"><strong data-i18n="taglineStrong"></strong><br>
        <span data-i18n="taglineText"></span></p>
    </section>

    <section class="card trial-card" aria-labelledby="calc-h">
      <h2 id="calc-h" data-i18n="calcTitle"></h2>
      <div class="grid">
        <label for="p-valore"><span data-i18n="labelValue"></span>
          <input type="number" id="p-valore" min="0" step="1" inputmode="decimal" autocomplete="off">
        </label>
        <label for="p-ristr"><span data-i18n="labelRenovation"></span>
          <input type="number" id="p-ristr" min="0" step="1" inputmode="decimal" autocomplete="off">
        </label>
        <label for="p-altri"><span data-i18n="labelOther"></span>
          <input type="number" id="p-altri" min="0" step="1" inputmode="decimal" autocomplete="off">
        </label>
      </div>
      <div class="actions actions-center">
        <button type="button" class="btn btn-primary" id="p-calcola" data-i18n="button"></button>
      </div>
      <p class="notice" id="p-esito" role="status"></p>
      <p class="small" id="p-formula" aria-hidden="true"></p>
      <p class="small"><span data-i18n="noteBefore"></span><a href="asta.html" data-i18n="noteLink"></a><span data-i18n="noteAfter"></span></p>
    </section>

    <section class="section" id="trust-section">
      <div class="grid grid-3">
        <div class="card"><h3 data-i18n="trust1Title"></h3><p data-i18n="trust1Text"></p></div>
        <div class="card"><h3 data-i18n="trust2Title"></h3><p data-i18n="trust2Text"></p></div>
        <div class="card"><h3 data-i18n="trust3Title"></h3><p data-i18n="trust3Text"></p></div>
      </div>
    </section>
      <section class="ask-everywhere" aria-label="Ask iCARe">
      <form class="home-ask" action="icare.html" method="get">
        <label class="visually-hidden" for="q2">Ask iCARe</label>
        <input type="text" id="q2" name="q" placeholder="One question. A world of auctions." autocomplete="off">
        <button type="submit" class="btn btn-primary">Ask</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><span data-i18n="footerText"></span><strong data-i18n="footerStrong"></strong></p>
      <p><a href="privacy.html" data-i18n="footerPrivacy"></a> · <a href="cookie.html" data-i18n="footerCookie"></a> · <a href="terms.html" data-i18n="footerTerms"></a></p>
    </div>
  </footer>
</body>
</html>
