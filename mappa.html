<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'">
  <title>Disegna la tua zona — iCARe cerca lì · CARe Auctions</title>
  <meta name="description" content="Disegna sulla mappa l'area dove vuoi la tua casa: iCARe cerca le aste proprio lì.">
  <link rel="canonical" href="https://careauctions.co/mappa.html">
  <link rel="stylesheet" href="styles10.css">
  <style>
    #tela { width: 100%; max-width: 720px; height: 420px; border: 1px solid #EDEFF2; border-radius: 1rem; background: #FFFFFF; touch-action: none; display: block; }
    #tela svg { width: 100%; height: 100%; }
    .zona-fondo { fill: #F1F4F8; stroke: #E3E8EF; }
    .zone { fill: #FFFFFF; stroke: #D9DFE7; stroke-width: 1; cursor: pointer; }
    .zone:hover { fill: #EDF1F6; }
    .scelta { fill: #0F1E3A; opacity: .82; }
    .etichetta { font-size: 10px; fill: #6B7280; pointer-events: none; }
  </style>
</head>
<body class="page-registrati">
  <main class="container" id="main">
    <div class="page-head">
      <h1>Disegna la tua zona.</h1>
      <p class="lead">Tocca le zone dove vuoi cercare la casa dei tuoi sogni — iCARe cercherà le aste proprio lì.</p>
    </div>
    <div id="tela"></div>
    <p id="esito" class="lead" style="margin-top:1rem" aria-live="polite"></p>
    <p><a class="btn btn-primary" id="vai" href="icare.html">Invia a iCARe</a></p>
  </main>
  <script>
    (function () {
      /* 5.256: mappa stilizzata dell'Italia (SVG zero dipendenze, CSP-safe) — si disegna per zone.
       * Le forme sono semplificate; il tocco seleziona le regioni da cercare. */
      var zone = [
        { n: 'Valle d\u0027Aosta', x: 52, y: 34, w: 26, h: 26 },
        { n: 'Piemonte', x: 30, y: 56, w: 52, h: 40 },
        { n: 'Lombardia', x: 66, y: 38, w: 58, h: 34 },
        { n: 'Trentino', x: 110, y: 24, w: 30, h: 26 },
        { n: 'Veneto', x: 124, y: 36, w: 44, h: 30 },
        { n: 'Friuli', x: 168, y: 30, w: 28, h: 26 },
        { n: 'Liguria', x: 34, y: 96, w: 22, h: 46 },
        { n: 'Emilia-Romagna', x: 62, y: 78, w: 58, h: 34 },
        { n: 'Toscana', x: 56, y: 114, w: 46, h: 36 },
        { n: 'Umbria', x: 104, y: 128, w: 26, h: 28 },
        { n: 'Marche', x: 130, y: 116, w: 26, h: 32 },
        { n: 'Lazio', x: 92, y: 160, w: 40, h: 34 },
        { n: 'Abruzzo', x: 128, y: 148, w: 30, h: 30 },
        { n: 'Molise', x: 146, y: 178, w: 18, h: 20 },
        { n: 'Campania', x: 118, y: 196, w: 34, h: 26 },
        { n: 'Puglia', x: 156, y: 180, w: 32, h: 30 },
        { n: 'Basilicata', x: 150, y: 214, w: 22, h: 22 },
        { n: 'Calabria', x: 142, y: 240, w: 24, h: 30 },
        { n: 'Sicilia', x: 104, y: 268, w: 56, h: 30 },
        { n: 'Sardegna', x: 22, y: 200, w: 34, h: 30 }
      ];
      var scelte = [];
      var tela = document.getElementById('tela');
      var svg = '<svg viewBox="0 0 200 320" role="img" aria-label="mappa Italia">';
      svg += '<rect class="zona-fondo" x="0" y="0" width="200" height="320" rx="12"></rect>';
      zone.forEach(function (z, i) {
        svg += '<g><rect class="zone" data-i="' + i + '" x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="6"></rect>';
        svg += '<text class="etichetta" x="' + (z.x + 3) + '" y="' + (z.y + z.h / 2 + 3) + '">' + z.n + '</text></g>';
      });
      svg += '</svg>';
      tela.innerHTML = svg;
      var esito = document.getElementById('esito');
      var vai = document.getElementById('vai');
      tela.addEventListener('click', function (ev) {
        var r = ev.target.closest('.zone');
        if (!r) return;
        var i = Number(r.getAttribute('data-i'));
        var p = scelte.indexOf(i);
        if (p >= 0) { scelte.splice(p, 1); r.classList.remove('scelta'); }
        else { scelte.push(i); r.classList.add('scelta'); }
        var nomi = scelte.map(function (k) { return zone[k].n; });
        esito.textContent = nomi.length ? ('Zona scelta: ' + nomi.join(', ') + ' — iCARe cercherà le aste qui.') : 'Tocca una o più zone per disegnare la tua area.';
        try { localStorage.setItem('icare-zone', nomi.join(',')); } catch (e) {}
        vai.setAttribute('href', 'icare.html?q=' + encodeURIComponent('Cerco casa in: ' + nomi.join(', ')));
      });
      try { var z = localStorage.getItem('icare-zone'); if (z) esito.textContent = 'Zona scelta: ' + z + ' — iCARe cercherà le aste qui.'; } catch (e) {}
    })();
  </script>
</body>
</html>
